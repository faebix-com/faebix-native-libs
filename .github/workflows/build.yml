#
# Verifies the vendored sources, builds the static libraries for every ABI,
# checks linking and 16 KB alignment, and, when started by hand with a
# release tag, publishes a GitHub release with one archive per ABI and
# SHA-256 checksums.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to publish, for example v1.0.0. Leave empty to build only."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: "28.2.13676358"
  ANDROID_API: "31"

jobs:
  verify-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare third_party with upstream
        run: bash scripts/verify-sources.sh

  build:
    needs: verify-sources
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release tag
        if: inputs.release != ''
        env:
          TAG: ${{ inputs.release }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v1.2.3" >&2; exit 1; }
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Releases are built from main only" >&2; exit 1; }
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build nasm
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build
        env:
          RELEASE_VERSION: ${{ inputs.release != '' && inputs.release || 'dev' }}
        run: bash scripts/build-android.sh "${{ matrix.abi }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libs-${{ matrix.abi }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release != '' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: libs-*
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        env:
          TAG: ${{ inputs.release }}
        run: |
          cd dist
          sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS
          {
            echo "Static libraries for Android, built from commit $GITHUB_SHA with NDK $NDK_VERSION, minimum API $ANDROID_API."
            echo
            echo "- libjpeg-turbo $(sed -n 's/^libjpeg-turbo.version //p' ../SOURCES) (libjpeg API, SIMD on)"
            echo "- piex $(sed -n 's/^piex.commit //p' ../SOURCES)"
            echo
            echo "One archive per ABI with lib/, include/, licenses/, NOTICE, BUILDINFO and FILES.sha256."
            echo "This software is based in part on the work of the Independent JPEG Group."
            echo
            echo "SHA-256:"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > ../release-notes.md
          cat ../release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md
